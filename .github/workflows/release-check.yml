name: Source release checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked source and staged content
        run: python3 -B tools/check_release.py --staged
      - name: Exercise publication guards
        run: python3 -B -m unittest discover -s tests -p 'test_release_check.py'
